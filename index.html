/* ===================== SPA ===================== */
const App = {
  cur: -1,
  visited: LS.get('visited', []),
  init(){
    this.buildSidebar();
    this.buildSelects();
    this.setupSearch();
    this.bindChrome();
    this.go(0, 1, true);
  },
  buildSidebar(){
    const groups = [];
    PAGES.forEach((p, i) => {
      let g = groups.find(x => x.g === p.g);
      if (!g){ g = { g: p.g, items: [] }; groups.push(g); }
      g.items.push({ ...p, i });
    });
    const collapsed = LS.get('collapsed', []);
    $('#sideScroll').innerHTML = groups.map((gr, gi) =>
      '<div class="side-group'+(collapsed.includes(gi)?' collapsed':'')+'" data-gi="'+gi+'">' +
      '<button type="button" data-sg-toggle aria-expanded="'+(!collapsed.includes(gi))+'">'+gr.g+'<span class="group-count">'+gr.items.length+'</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></button>' +
      '<div class="side-items">' + gr.items.map(p =>
        '<button class="side-link" data-gi="'+p.i+'" title="'+p.t+'">'+ico(p.icon)+'<span>'+p.t+'</span><span class="done-dot hide"></span></button>').join('') +
      '</div></div>').join('');
    $('#sideScroll').addEventListener('click', e => {
      const tg = e.target.closest('[data-sg-toggle]');
      if (tg){ tg.parentElement.classList.toggle('collapsed');
        tg.setAttribute('aria-expanded', String(!tg.parentElement.classList.contains('collapsed')));
        LS.set('collapsed', $$('.side-group').map((el, i) => el.classList.contains('collapsed') ? i : -1).filter(i => i >= 0));
        return; }
      const link = e.target.closest('.side-link');
      if (link) this.go(+link.getAttribute('data-gi'));
    });
  },
  setupSearch(){
    const input = $('#moduleSearch');
    const count = $('#searchCount');
    const search = () => {
      const keyword = input.value.trim().toLocaleLowerCase('id-ID');
      let matched = 0;
      $$('.side-group').forEach(group => {
        let groupMatched = 0;
        $$('.side-link', group).forEach(link => {
          const visible = (link.textContent || '').toLocaleLowerCase('id-ID').includes(keyword)
            || (group.querySelector('[data-sg-toggle]').textContent || '').toLocaleLowerCase('id-ID').includes(keyword);
          link.hidden = !visible;
          if (visible) groupMatched++;
        });
        group.hidden = groupMatched === 0;
        if (keyword && groupMatched) {
          group.classList.remove('collapsed');
          group.querySelector('[data-sg-toggle]').setAttribute('aria-expanded', 'true');
        }
        matched += groupMatched;
      });
      count.textContent = keyword ? (matched ? matched+' materi ditemukan' : 'Tidak ada materi yang sesuai') : '';
      count.classList.toggle('active', Boolean(keyword));
    };
    input.addEventListener('input', search);
    const showSearch = () => {
      if (matchMedia('(max-width:860px)').matches) document.body.classList.add('drawer-open');
      requestAnimationFrame(() => input.focus());
    };
    $('#btnQuickFind').onclick = showSearch;
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); showSearch(); return;
      }
      if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey
        && !e.target.matches('input,textarea,select') && !$('#lightbox').classList.contains('open')) {
        e.preventDefault(); showSearch();
      }
      if (e.key === 'Escape' && document.body.classList.contains('drawer-open')) {
        document.body.classList.remove('drawer-open'); $('#btnMenu').focus();
      }
    });
  },
  buildSelects(){
    const groups = [];
    PAGES.forEach((p, i) => {
      let g = groups.find(x => x.g === p.g);
      if (!g){ g = { g: p.g, items: [] }; groups.push(g); }
      g.items.push({ ...p, i });
    });
    const opts = groups.map(gr =>
      '<optgroup label="'+gr.g+'">' + gr.items.map(p => '<option value="'+p.i+'">'+p.t+'</option>').join('') + '</optgroup>').join('');
    $('#selHeader').innerHTML = opts;
    $('#selBottom').innerHTML = opts;
    $('#selHeader').addEventListener('change', e => this.go(+e.target.value));
    $('#selBottom').addEventListener('change', e => this.go(+e.target.value));
  },
  bindChrome(){
    $('#btnPrev').onclick = () => this.go(this.cur - 1, -1);
    $('#btnNext').onclick = () => this.go(this.cur + 1, 1);
    document.addEventListener('keydown', e => {
      if ($('#lightbox').classList.contains('open')) return;
      if (e.target.matches('input,select,textarea')) return;
      if (e.key === 'ArrowLeft') this.go(this.cur - 1, -1);
      if (e.key === 'ArrowRight') this.go(this.cur + 1, 1);
    });
    /* panel delegation */
    const panel = $('#panel');
    panel.addEventListener('click', e => {
      const z = e.target.closest('[data-zoom]');
      if (z){ Lightbox.open(z.getAttribute('src'), z.getAttribute('data-cap') || z.alt); return; }
      const g = e.target.closest('[data-goto]');
      if (g){ const idx = PAGES.findIndex(p => p.id === g.getAttribute('data-goto')); if (idx >= 0) this.go(idx); return; }
      const acc = e.target.closest('[data-acc]');
      if (acc){ acc.parentElement.classList.toggle('open'); return; }
    });
    panel.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-goto][role="button"]')) {
        e.preventDefault(); e.target.click();
      }
    });
    /* drawer */
    $('#btnMenu').onclick = () => document.body.classList.add('drawer-open');
    $('#drawerOverlay').onclick = () => document.body.classList.remove('drawer-open');
    /* theme */
    const savedTheme = LS.get('theme', 'dark');
    document.documentElement.setAttribute('data-theme', savedTheme);
    $('#btnTheme').onclick = () => {
      const h = document.documentElement;
      const next = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      h.setAttribute('data-theme', next);
      LS.set('theme', next);
    };
    /* fullscreen */
    $('#btnFull').onclick = () => {
      const d = document.documentElement;
      if (!document.fullscreenElement){ if (d.requestFullscreen) d.requestFullscreen().catch(()=>{}); }
      else if (document.exitFullscreen) document.exitFullscreen();
    };
    /* pengaturan tampilan */
    $('#btnFs').onclick = e => { e.stopPropagation(); $('#fsMenu').classList.toggle('open'); };
    document.addEventListener('click', e => {
      if (!e.target.closest('#fsMenu') && !e.target.closest('#btnFs')) $('#fsMenu').classList.remove('open');
    });
    $$('#fsMenu [data-fs]').forEach(b => b.onclick = () => {
      const v = b.getAttribute('data-fs');
      document.documentElement.setAttribute('data-fs', v);
      LS.set('fs', v);
    });
    const savedFs = LS.get('fs', '1');
    document.documentElement.setAttribute('data-fs', savedFs);
    const chk = $('#chkMotion');
    chk.checked = LS.get('motion', true);
    const applyMotion = () => {
      document.documentElement.setAttribute('data-anim', chk.checked ? 'on' : 'off');
      LS.set('motion', chk.checked);
    };
    chk.onchange = applyMotion; applyMotion();
  },
  go(idx, dir, first){
    if (idx < 0 || idx >= PAGES.length) return;
    if (idx === this.cur && !first) return;
    dir = dir || (idx > this.cur ? 1 : -1);
    this.cur = idx;
    const page = PAGES[idx];
    const panel = $('#panel'), view = $('#panelView');
    /* render konten baru lalu kembalikan scroll internal ke atas */
    view.innerHTML = page.render();
    const heroMachine = view.querySelector('.hero-photo img');
    if (heroMachine) {
      heroMachine.addEventListener('error', () => heroMachine.classList.add('image-unavailable'), {once:true});
      if (heroMachine.complete && heroMachine.naturalWidth === 0) heroMachine.classList.add('image-unavailable');
    }
    if (idx > 0) {
      const context = document.createElement('div');
      context.className = 'page-context';
      const group = document.createElement('span');
      group.className = 'page-context-group'; group.textContent = page.g;
      const divider = document.createElement('span');
      divider.className = 'page-context-divider'; divider.textContent = '/';
      const module = document.createElement('span');
      module.className = 'page-context-module'; module.textContent = 'MODUL '+String(idx+1).padStart(2,'0')+' / '+PAGES.length;
      context.append(group,divider,module);
      view.prepend(context);
    }
    panel.scrollTop = 0;
    panel.classList.remove('in-f','in-b');
    void panel.offsetWidth;
    panel.classList.add(dir > 0 ? 'in-f' : 'in-b');
    /* tandai dikunjungi */
    if (!this.visited.includes(page.id)){ this.visited.push(page.id); LS.set('visited', this.visited); }
    /* sinkronkan UI */
    $$('.side-link').forEach(l => {
      const on = +l.getAttribute('data-gi') === idx;
      l.classList.toggle('active', on);
      if (on) l.setAttribute('aria-current', 'page'); else l.removeAttribute('aria-current');
      l.querySelector('.done-dot').classList.toggle('hide', !this.visited.includes(PAGES[+l.getAttribute('data-gi')].id));
    });
    $('#selHeader').value = idx; $('#selBottom').value = idx;
    $('#btnPrev').disabled = idx === 0;
    $('#btnNext').disabled = idx === PAGES.length - 1;
    $('#navPosLbl').textContent = 'Modul ' + (idx+1) + ' / ' + PAGES.length + ' — ' + page.t;
    const pct = Math.round(this.visited.length / PAGES.length * 100);
    $('#sideProgressTxt').textContent = pct + '%';
    $('#sideProgressDetail').textContent = this.visited.length + '/' + PAGES.length;
    $('#sideProgressFill').style.width = pct + '%';
    $('#navProgressFill').style.width = Math.round((idx+1) / PAGES.length * 100) + '%';
    /* inisialisasi khusus halaman */
    bindChecklist(view);
    bindTabs(view);
    if (INIT[page.id]) INIT[page.id](view);
    /* tutup drawer di HP */
    if (document.body.classList.contains('drawer-open')) document.body.classList.remove('drawer-open');
  }
};

document.addEventListener('DOMContentLoaded', () => {
  bindLightbox();
  App.init();
});

</script>
