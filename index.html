<!DOCTYPE html>
<html lang="id" data-theme="dark" data-fs="1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Website pembelajaran interaktif Section Tool Grinding (TGr) Politeknik ATMI Surakarta — penggerindaan alat potong dan mesin gerinda Great D1, Vitax, dan Greif.">
<meta name="theme-color" content="#07111F">
<title>Pembelajaran Section Tool Grinding (TGr) — Politeknik ATMI Surakarta</title>
<link rel="icon" type="image/png" href="./assets/images/logo-atmi.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   PEMBELAJARAN SECTION TOOL GRINDING (TGr)
   Politeknik ATMI Surakarta — statis, siap GitHub Pages
   ============================================================ */
:root{
  --bg0:#07111F; --bg1:#0D1B30; --bg2:#10233D; --bg3:#152A47;
  --glass:rgba(13,27,48,.66); --glass2:rgba(16,35,61,.55);
  --line:rgba(148,163,184,.16); --line2:rgba(34,211,238,.28);
  --blue:#2563EB; --cyan:#06B6D4; --neon:#22D3EE;
  --text:#F8FAFC; --muted:#94A3B8; --soft:#CBD5E1;
  --ok:#10B981; --warn:#F59E0B; --danger:#EF4444;
  --grad:linear-gradient(135deg,#2563EB 0%,#06B6D4 55%,#22D3EE 100%);
  --grad-soft:linear-gradient(135deg,rgba(37,99,235,.18),rgba(34,211,238,.10));
  --shadow:0 10px 34px rgba(2,8,20,.55);
  --shadow-sm:0 4px 16px rgba(2,8,20,.4);
  --glow:0 0 0 1px rgba(34,211,238,.35),0 0 22px rgba(34,211,238,.16);
  --r:16px; --r-sm:10px;
  --sidebar-w:296px; --header-h:64px; --bottom-h:62px;
}
html[data-fs="2"]{font-size:17.5px}
html[data-fs="3"]{font-size:19px}
html[data-theme="light"]{
  --bg0:#EEF3F9; --bg1:#FFFFFF; --bg2:#FFFFFF; --bg3:#F3F7FC;
  --glass:rgba(255,255,255,.86); --glass2:rgba(255,255,255,.72);
  --line:rgba(15,23,42,.12); --line2:rgba(37,99,235,.30);
  --text:#0F172A; --muted:#51617A; --soft:#334155;
  --grad-soft:linear-gradient(135deg,rgba(37,99,235,.10),rgba(6,182,212,.08));
  --shadow:0 10px 30px rgba(15,23,42,.12);
  --shadow-sm:0 3px 12px rgba(15,23,42,.08);
  --glow:0 0 0 1px rgba(37,99,235,.28),0 6px 18px rgba(37,99,235,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
html{font-size:16px}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg0); color:var(--text);
  overflow:hidden; overflow-x:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3,h4,.font-display{font-family:'Poppins','Inter',system-ui,sans-serif}
img{max-width:100%;height:auto;display:block}
button{font-family:inherit;cursor:pointer}
select,input{font-family:inherit}
a{color:var(--neon);text-decoration:none}
a:hover{text-decoration:underline}
html{scrollbar-color:rgba(148,163,184,.35) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.28);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(34,211,238,.5);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
body{transition:background-color .3s ease,color .3s ease}

/* ===================== APPLICATION SHELL ===================== */
#app{
  height:100vh; height:100dvh;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:var(--header-h) minmax(0,1fr) auto;
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(37,99,235,.14), transparent 60%),
    radial-gradient(900px 420px at -10% 110%, rgba(6,182,212,.10), transparent 60%),
    var(--bg0);
}
#app > *{min-width:0}
.mid{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:0}

/* ===================== HEADER ===================== */
.app-header{
  position:relative;z-index:40;
  display:flex;align-items:center;gap:14px;
  padding:0 18px;height:var(--header-h);
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 0;min-width:0;overflow:hidden}
.brand .logo{
  width:42px;height:42px;border-radius:12px;object-fit:contain;flex:none;
  background:#fff;padding:3px;box-shadow:0 0 0 1px var(--line2),0 0 18px rgba(34,211,238,.25);
}
.brand .tt{min-width:0;flex:1 1 auto;line-height:1.15;overflow:hidden}
.brand .tt .kicker{
  font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;
}
.brand .tt .title{font-family:'Poppins',sans-serif;font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-tools{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.mod-select-wrap{position:relative}
.mod-select{
  appearance:none;-webkit-appearance:none;
  background:var(--bg2);color:var(--text);
  border:1px solid var(--line);border-radius:12px;
  padding:9px 38px 9px 14px;font-size:.86rem;font-weight:600;max-width:250px;
  transition:border-color .2s,box-shadow .2s;cursor:pointer;
}
.mod-select:focus{outline:none;border-color:var(--neon);box-shadow:var(--glow)}
.mod-select-wrap::after{
  content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;pointer-events:none;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:translateY(-70%) rotate(45deg);
}
.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);display:inline-flex;align-items:center;justify-content:center;
  transition:border-color .2s,box-shadow .2s,transform .15s;flex:none;
}
.icon-btn:hover{border-color:var(--neon);box-shadow:var(--glow);transform:translateY(-1px)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .sun{display:none}
html[data-theme="light"] .icon-btn .sun{display:block}
html[data-theme="light"] .icon-btn .moon{display:none}
#btnMenu{display:none}
#fsMenu{
  position:absolute;top:calc(var(--header-h) - 6px);right:14px;z-index:60;
  background:var(--bg1);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:10px;width:230px;display:none;
}
#fsMenu.open{display:block;animation:pop .18s ease}
#fsMenu label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.84rem;color:var(--muted);padding:7px 4px;font-weight:600}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ===================== SIDEBAR ===================== */
.sidebar{
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.side-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px 10px;scrollbar-gutter:stable}
.side-group{margin-bottom:6px}
.side-group > button{
  width:100%;display:flex;align-items:center;gap:9px;
  background:none;border:none;color:var(--muted);
  font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:10px 10px 8px;border-radius:10px;transition:color .2s;text-align:left;
}
.side-group > button:hover{color:var(--neon)}
.side-group > button .chev{margin-left:auto;transition:transform .22s;flex:none;width:14px;height:14px}
.side-group.collapsed > button .chev{transform:rotate(-90deg)}
.side-items{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.side-group.collapsed .side-items{display:none}
.side-link{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 12px;border-radius:11px;border:1px solid transparent;
  background:none;color:var(--soft);font-size:.885rem;font-weight:500;
  position:relative;transition:background-color .18s,color .18s,border-color .18s;
}
.side-link .ico{width:19px;height:19px;flex:none;opacity:.75}
.side-link .ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-link:hover{background:var(--glass2);color:var(--text)}
.side-link.active{
  background:linear-gradient(90deg,rgba(37,99,235,.22),rgba(34,211,238,.08));
  border-color:var(--line2);color:#fff;font-weight:700;
}
html[data-theme="light"] .side-link.active{color:var(--blue)}
.side-link.active::before{
  content:"";position:absolute;left:-1px;top:22%;bottom:22%;width:3px;border-radius:3px;
  background:var(--grad);box-shadow:0 0 10px rgba(34,211,238,.8);
}
.side-link .done-dot{margin-left:auto;flex:none;width:7px;height:7px;border-radius:50%;background:var(--ok);opacity:.85;box-shadow:0 0 8px rgba(16,185,129,.7)}
.side-foot{border-top:1px solid var(--line);padding:12px 16px 14px;flex:none}
.side-foot .lbl{display:flex;justify-content:space-between;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.progress-track{height:7px;border-radius:6px;background:var(--bg3);overflow:hidden}
.progress-fill{height:100%;width:0%;border-radius:6px;background:var(--grad);box-shadow:0 0 12px rgba(34,211,238,.55);transition:width .4s ease}
#drawerOverlay{display:none}

/* ===================== PANEL ===================== */
.panel-wrap{min-width:0;display:flex;flex-direction:column;min-height:0;position:relative}
#panel{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;
  padding:26px clamp(16px,3.4vw,44px) 44px;
}
#panel .view{max-width:1120px;margin:0 auto}
#panel.in-f .view{animation:panelF .26s cubic-bezier(.22,.8,.36,1) both}
#panel.in-b .view{animation:panelB .26s cubic-bezier(.22,.8,.36,1) both}
@keyframes panelF{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes panelB{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}

/* ===================== BOTTOM NAV ===================== */
.bottom-nav{
  min-height:var(--bottom-h);display:flex;align-items:center;gap:12px;
  padding:10px clamp(12px,2.4vw,28px);
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);z-index:30;
}
.nav-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font-weight:700;font-size:.86rem;
  transition:transform .16s,box-shadow .2s,border-color .2s,opacity .2s;white-space:nowrap;
}
.nav-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover:not(:disabled){border-color:var(--neon);box-shadow:var(--glow);transform:translateY(-1px)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn.primary{background:var(--grad);border:none;color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.35)}
.nav-btn.primary:hover:not(:disabled){box-shadow:0 8px 24px rgba(34,211,238,.45)}
.bottom-nav .pos{display:flex;flex-direction:column;gap:4px;min-width:120px;flex:none;overflow:hidden}
.bottom-nav .pos .lbl{font-size:.7rem;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom-nav .pos .progress-track{height:5px}
.bottom-nav .mod-select{max-width:330px;flex:1;min-width:120px}
.bottom-nav .mod-select-wrap{min-width:0}
@media (max-width:760px){.bottom-nav .mod-select{display:none}.bottom-nav .mod-select-wrap{display:none}.bottom-nav .pos{flex:1;min-width:0}.nav-btn .txt-full{display:none}}

/* ===================== TIPOGRAFI & KONTEN ===================== */
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--neon);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:26px;height:2px;border-radius:2px;background:var(--grad)}
h1.page-title{font-size:clamp(1.5rem,3vw,2.15rem);font-weight:800;letter-spacing:-.02em;line-height:1.18;margin-bottom:8px}
p.page-sub{color:var(--muted);font-size:.99rem;line-height:1.65;max-width:75ch;margin-bottom:26px}
.sec-title{font-size:1.22rem;font-weight:700;margin:34px 0 6px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.sec-title .num{width:30px;height:30px;flex:none;border-radius:9px;background:var(--grad-soft);border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;color:var(--neon)}
.sec-sub{color:var(--muted);font-size:.92rem;margin-bottom:18px;line-height:1.6}
p.body-p{line-height:1.75;color:var(--soft);margin-bottom:14px;font-size:.965rem}
p.body-p b,p.body-p strong{color:var(--text)}
.note{
  border-left:3px solid var(--cyan);background:var(--grad-soft);
  padding:13px 16px;border-radius:0 12px 12px 0;margin:16px 0;font-size:.9rem;line-height:1.65;color:var(--soft);
}
.note b{color:var(--text)}
.note.warn{border-left-color:var(--warn)}
.note.ok{border-left-color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:.78rem;font-weight:700;border:1px solid var(--line2);color:var(--neon);background:rgba(34,211,238,.08);white-space:nowrap}
.chip.blue{color:#7CA6FF;border-color:rgba(37,99,235,.4);background:rgba(37,99,235,.12)}
.chip.ok{color:var(--ok);border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.1)}
.chip.warn{color:var(--warn);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.1)}
.chip.danger{color:var(--danger);border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.1)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.divider{height:1px;background:var(--line);margin:30px 0;border:none}

/* ===================== KARTU & GRID ===================== */
.grid{display:grid;gap:16px}
.grid > *, .stat-row > *, .check-list > *, .flex > *, .g2 > *, .g3 > *, .g4 > *, .g-2-1 > *{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:2fr 1fr}
.card{
  background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  transition:transform .22s ease,box-shadow .25s ease,border-color .22s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line2)}
.card.glow-top::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad);opacity:.8}
.card h3{font-size:1.02rem;font-weight:700;margin-bottom:8px}
.card p{color:var(--muted);font-size:.9rem;line-height:1.65}
.card .cicon{width:42px;height:42px;border-radius:12px;background:var(--grad-soft);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:var(--neon)}
.card .cicon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat-row{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}
.stat{flex:1;min-width:130px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm)}
.stat .v{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.3rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .k{font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}

/* ===================== FIGURE / GAMBAR ===================== */
figure.fig{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow-sm);margin:0}
figure.fig img{width:100%;border-radius:11px;cursor:zoom-in;object-fit:cover}
figure.fig figcaption{padding:10px 8px 4px;font-size:.8rem;color:var(--muted);text-align:center;line-height:1.5}
.fig-frame{position:relative}
.hero-photo{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line2);box-shadow:var(--shadow),0 0 40px rgba(34,211,238,.10)}
.hero-photo img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(200deg,rgba(7,17,31,0) 40%,rgba(7,17,31,.55));pointer-events:none}
.hero-photo .tag{position:absolute;left:14px;bottom:12px;z-index:2;background:rgba(7,17,31,.78);color:#E6F6FF;padding:7px 13px;border-radius:10px;font-size:.78rem;font-weight:700;backdrop-filter:blur(8px);border:1px solid rgba(34,211,238,.35)}
.scanline{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.scanline::before{content:"";position:absolute;left:0;right:0;top:-30%;height:26%;background:linear-gradient(180deg,transparent,rgba(34,211,238,.13),transparent);animation:scan 7s linear infinite}
@keyframes scan{0%{top:-30%}100%{top:110%}}

/* ===================== TABEL ===================== */
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--glass);box-shadow:var(--shadow-sm);scrollbar-gutter:stable}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
table.tbl th{
  text-align:left;padding:12px 16px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--neon);
  border-bottom:1px solid var(--line2);background:rgba(34,211,238,.05);white-space:nowrap;
}
table.tbl td{padding:11px 16px;border-bottom:1px solid var(--line);color:var(--soft);vertical-align:top;line-height:1.5}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover td{background:rgba(34,211,238,.035)}
table.tbl td.val{font-weight:700;color:var(--text);white-space:nowrap}
table.tbl td.num{font-family:'Poppins',sans-serif;font-weight:700;color:var(--text)}

/* ===================== TOMBOL UMUM ===================== */
.btn{
  display:inline-flex;align-items:center;gap:9px;padding:11px 20px;border-radius:12px;
  font-weight:700;font-size:.9rem;border:1px solid var(--line);background:var(--bg2);color:var(--text);
  transition:transform .16s,box-shadow .2s,border-color .2s,background .2s;
}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{border-color:var(--neon);box-shadow:var(--glow);transform:translateY(-1px)}
.btn.primary{background:var(--grad);border:none;color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.35)}
.btn.primary:hover{box-shadow:0 8px 26px rgba(34,211,238,.45)}
.btn.ok{border-color:rgba(16,185,129,.5);color:var(--ok)}
.btn.sm{padding:8px 14px;font-size:.8rem;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* ===================== TABS ===================== */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{
  padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--glass);
  color:var(--muted);font-weight:700;font-size:.88rem;transition:all .2s;
}
.tab:hover{color:var(--text);border-color:var(--line2)}
.tab.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.tabpane{display:none}
.tabpane.active{display:block;animation:fadeUp .26s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===================== CHECKLIST ===================== */
.check-list{display:flex;flex-direction:column;gap:10px}
.check-item{
  display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border-radius:13px;
  background:var(--glass);border:1px solid var(--line);cursor:pointer;transition:border-color .2s,background .2s,transform .15s;
}
.check-item:hover{border-color:var(--line2);transform:translateX(3px)}
.check-item input{display:none}
.check-item .box{
  width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;transition:all .2s;color:transparent;
}
.check-item .box svg{width:13px;height:13px;stroke-width:3.2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.check-item input:checked ~ .box{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 0 12px rgba(16,185,129,.5)}
.check-item .txt{font-size:.93rem;line-height:1.55;color:var(--soft)}
.check-item input:checked ~ .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(148,163,184,.5)}
.check-item .txt b{color:var(--text)}
.check-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 12px;flex-wrap:wrap}
.check-head .st{font-size:.85rem;font-weight:700;color:var(--neon)}

/* ===================== FLOWCHART ===================== */
.flow{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0}
.flow-node{
  width:min(430px,100%);background:var(--glass);border:1.5px solid var(--line2);border-radius:14px;
  padding:15px 18px;text-align:center;position:relative;box-shadow:var(--shadow-sm);cursor:pointer;
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.flow-node:hover{transform:translateY(-2px);box-shadow:var(--glow)}
.flow-node .fn-t{font-weight:800;font-size:.98rem;font-family:'Poppins',sans-serif}
.flow-node .fn-d{font-size:.8rem;color:var(--muted);margin-top:5px;line-height:1.5}
.flow-node.start{border-color:rgba(34,211,238,.65);box-shadow:0 0 18px rgba(34,211,238,.14)}
.flow-node.final{border-color:rgba(16,185,129,.6);background:linear-gradient(135deg,rgba(16,185,129,.12),var(--glass))}
.flow-node.repeat{border-style:dashed;border-color:rgba(245,158,11,.55)}
.flow-node.open{border-color:var(--neon);box-shadow:var(--glow)}
.flow-arrow{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;position:relative}
.flow-arrow .stem{width:2px;height:26px;background:linear-gradient(180deg,var(--cyan),var(--blue));border-radius:2px}
.flow-arrow .head{width:9px;height:9px;border-right:2px solid var(--cyan);border-bottom:2px solid var(--cyan);transform:rotate(45deg);margin-top:-6px}
.flow-arrow .lbl{font-size:.72rem;font-weight:800;color:var(--ok);letter-spacing:.06em;text-transform:uppercase}
.flow-arrow .lbl.no{color:var(--warn)}
.flow-loop{
  width:min(430px,100%);border:1.5px dashed rgba(245,158,11,.5);border-radius:12px;
  padding:10px 16px;margin-top:10px;font-size:.8rem;color:var(--warn);line-height:1.55;background:rgba(245,158,11,.05);
}
.flow-note{
  width:min(520px,100%);text-align:left;font-size:.83rem;color:var(--muted);line-height:1.6;
  background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:12px 15px;
}
.flow-note b{color:var(--text)}
.flow-detail{
  width:min(560px,100%);margin-top:12px;display:none;text-align:left;
  background:var(--grad-soft);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;font-size:.88rem;line-height:1.65;color:var(--soft);
}
.flow-detail.show{display:block;animation:fadeUp .22s ease}
.flow-detail b{color:var(--text)}

/* ===================== STEPPER ===================== */
.stepper{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
.stepper-top{padding:18px 22px 0}
.stepper-top .steps-lbl{display:flex;justify-content:space-between;font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.stepper-top .steps-lbl b{color:var(--neon)}
.stepper-body{padding:20px 22px;min-height:190px}
.stepper-body .st-title{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.12rem;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.stepper-body .st-title .n{width:30px;height:30px;flex:none;border-radius:9px;background:var(--grad);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.88rem}
.stepper-body .st-desc{color:var(--soft);line-height:1.75;font-size:.94rem}
.stepper-body .st-media{margin-top:14px;display:flex;gap:12px;flex-wrap:wrap}
.stepper-body .st-media img{width:132px;height:132px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}
.stepper-foot{display:flex;align-items:center;gap:10px;padding:14px 22px 18px;border-top:1px solid var(--line)}
.stepper-foot .spacer{flex:1}
.step-dots{display:flex;gap:6px;flex-wrap:wrap}
.step-dots .dot{width:9px;height:9px;border-radius:50%;background:var(--bg3);border:1px solid var(--line);transition:all .2s}
.step-dots .dot.cur{background:var(--neon);box-shadow:0 0 8px rgba(34,211,238,.7)}
.step-dots .dot.done{background:var(--ok);border-color:var(--ok)}

/* ===================== SIMULATOR / FORM ===================== */
.sim{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:22px}
.sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:.76rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.field input,.field select{
  width:100%;padding:11px 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font-size:.95rem;font-weight:600;transition:border-color .2s,box-shadow .2s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--neon);box-shadow:var(--glow)}
.field .hint{font-size:.72rem;color:var(--muted);margin-top:5px;line-height:1.4}
.sim-result{
  margin-top:18px;border-radius:14px;border:1px solid var(--line2);
  background:var(--grad-soft);padding:18px 20px;
}
.sim-result .big{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.7rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sim-result .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.9rem;color:var(--soft)}
.sim-result .row:last-child{border-bottom:none}
.sim-result .row b{color:var(--text)}
.formula{
  font-family:'Poppins',sans-serif;font-weight:700;font-size:clamp(1.05rem,2.4vw,1.45rem);
  text-align:center;padding:20px 16px;border-radius:14px;
  background:var(--grad-soft);border:1px solid var(--line2);color:var(--text);letter-spacing:.01em;
}
.formula .op{color:var(--neon)}
.formula .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 6px}
.formula .frac .top{border-bottom:2px solid var(--neon);padding:0 10px 3px}
.formula .frac .bot{padding:3px 10px 0}
.formula-sub{font-size:.85rem;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6}

/* ===================== KUIS ===================== */
.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.q-opt{
  display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
  padding:14px 16px;border-radius:13px;border:1px solid var(--line);background:var(--glass);
  color:var(--text);font-size:.93rem;line-height:1.55;margin-bottom:10px;transition:all .18s;
}
.q-opt:hover:not(:disabled){border-color:var(--neon);transform:translateX(3px)}
.q-opt .abc{
  width:26px;height:26px;flex:none;border-radius:8px;border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:var(--neon);
}
.q-opt.correct{border-color:var(--ok);background:rgba(16,185,129,.12);box-shadow:0 0 14px rgba(16,185,129,.2)}
.q-opt.correct .abc{background:var(--ok);color:#fff;border-color:var(--ok)}
.q-opt.wrong{border-color:var(--danger);background:rgba(239,68,68,.1)}
.q-opt.wrong .abc{background:var(--danger);color:#fff;border-color:var(--danger)}
.q-opt:disabled{cursor:default;opacity:.92}
.q-explain{
  border-left:3px solid var(--ok);background:var(--grad-soft);padding:13px 16px;border-radius:0 12px 12px 0;
  font-size:.88rem;line-height:1.65;color:var(--soft);margin:14px 0;animation:fadeUp .25s ease;
}
.q-explain.w{border-left-color:var(--danger)}
.q-explain b{color:var(--text)}
.q-cat{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--neon)}
.score-hero{text-align:center;padding:26px 18px}
.score-hero .big{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:clamp(2.4rem,7vw,3.6rem);
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.cat-bars{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.cat-bars .cb{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:.8rem;color:var(--muted)}
.cat-bars .cb .track{height:8px;border-radius:6px;background:var(--bg3);overflow:hidden}
.cat-bars .cb .fill{height:100%;background:var(--grad);border-radius:6px}
.cat-bars .cb b{color:var(--text);text-align:right}

/* ===================== GALERI & LIGHTBOX ===================== */
.gal-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:13px}
.gal-item{
  position:relative;border-radius:13px;overflow:hidden;border:1px solid var(--line);
  background:var(--bg2);cursor:zoom-in;transition:transform .2s,box-shadow .25s,border-color .2s;aspect-ratio:4/3;
}
.gal-item img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.gal-item:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--glow)}
.gal-item:hover img{transform:scale(1.06)}
.gal-item .cap{
  position:absolute;left:0;right:0;bottom:0;padding:22px 12px 9px;font-size:.74rem;font-weight:600;color:#EAF6FF;
  background:linear-gradient(180deg,transparent,rgba(7,17,31,.88));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#lightbox{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(4,10,20,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#lightbox.open{display:flex;animation:lbIn .2s ease}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
#lbStage{max-width:min(1100px,94vw);max-height:78vh;position:relative;overflow:hidden;border-radius:14px;border:1px solid rgba(34,211,238,.3);box-shadow:0 20px 60px rgba(0,0,0,.6)}
#lbImg{max-width:100%;max-height:78vh;transition:transform .25s ease;cursor:grab;transform-origin:center center;user-select:none;-webkit-user-drag:none}
#lbImg.zoomed{cursor:grabbing}
#lbCaption{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);max-width:min(760px,90vw);
  background:rgba(7,17,31,.85);border:1px solid var(--line2);color:#E6F6FF;
  padding:11px 20px;border-radius:12px;font-size:.86rem;text-align:center;line-height:1.5;backdrop-filter:blur(8px);
}
.lb-btn{
  position:fixed;z-index:102;width:46px;height:46px;border-radius:50%;
  background:rgba(13,27,48,.85);border:1px solid var(--line2);color:#fff;
  display:flex;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(6px);
}
.lb-btn:hover{border-color:var(--neon);box-shadow:var(--glow)}
.lb-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#lbClose{top:20px;right:22px}
#lbPrev{left:18px;top:50%;transform:translateY(-50%)}
#lbNext{right:18px;top:50%;transform:translateY(-50%)}
#lbZoom{position:fixed;bottom:24px;right:22px}
#lbCount{position:fixed;top:26px;left:26px;color:#9FD9EA;font-weight:800;font-size:.85rem;letter-spacing:.08em;background:rgba(13,27,48,.8);padding:7px 14px;border-radius:999px;border:1px solid var(--line2)}

/* ===================== HOTSPOT & SIMULASI SVG ===================== */
.sim-box{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:16px}
.sim-box svg{width:100%;height:auto;display:block;border-radius:12px;background:radial-gradient(700px 320px at 50% 0%,rgba(37,99,235,.12),transparent 70%),var(--bg1);border:1px solid var(--line)}
.sim-controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;align-items:center}
.sim-controls .spacer{flex:1}
.sim-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:.78rem;color:var(--muted)}
.sim-legend .li{display:flex;align-items:center;gap:6px}
.sim-legend .sw{width:12px;height:12px;border-radius:4px}
.hotspot{cursor:pointer}
.hotspot circle.dot{fill:rgba(34,211,238,.25);stroke:var(--neon);stroke-width:2;transition:all .2s}
.hotspot text{fill:#fff;font-weight:800;font-size:11px;font-family:'Poppins',sans-serif;pointer-events:none}
.hotspot:hover circle.dot,.hotspot.on circle.dot{fill:var(--neon);filter:drop-shadow(0 0 6px rgba(34,211,238,.9))}
.wheel-rot{transform-origin:200px 128px;animation:spin 1.4s linear infinite;animation-play-state:paused}
.running .wheel-rot{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.spark{opacity:0}
.running .spark{animation:spark 1s ease-out infinite}
.running .spark.d2{animation-delay:.33s}
.running .spark.d3{animation-delay:.66s}
@keyframes spark{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(46px,64px)}}
.contact-pulse{animation:pulse 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
.sim-move-y{transition:transform .9s ease-in-out}
.sim-move-x{transition:transform 1.1s ease-in-out}
.sim-rotate{transition:transform 1s ease-in-out;transform-box:fill-box;transform-origin:center}
.angle-plate{transition:transform .5s ease;transform-box:fill-box;transform-origin:0% 100%}

/* ===================== ACCORDION ===================== */
.acc{border:1px solid var(--line);border-radius:14px;background:var(--glass);margin-bottom:11px;overflow:hidden;transition:border-color .2s}
.acc:hover{border-color:var(--line2)}
.acc > button{
  width:100%;display:flex;align-items:center;gap:13px;background:none;border:none;color:var(--text);
  padding:15px 18px;font-weight:700;font-size:.94rem;text-align:left;
}
.acc > button .thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line)}
.acc > button .chev{margin-left:auto;transition:transform .25s;flex:none;width:18px;height:18px}
.acc.open > button .chev{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.acc.open .acc-body{max-height:900px}
.acc-inner{padding:2px 18px 18px;display:grid;gap:14px;grid-template-columns:220px 1fr}
.acc-inner img{width:100%;border-radius:11px;cursor:zoom-in;border:1px solid var(--line)}
.acc-inner .tx p{font-size:.9rem;color:var(--soft);line-height:1.7;margin-bottom:9px}
.acc-inner .tx p b{color:var(--text)}
@media (max-width:640px){.acc-inner{grid-template-columns:1fr}.acc-inner img{max-width:280px}}

/* ===================== PROFIL ===================== */
.profile-card{text-align:center;padding:26px 20px}
.profile-card .pframe{width:150px;height:150px;margin:0 auto 16px;border-radius:50%;padding:4px;background:var(--grad);box-shadow:0 0 26px rgba(34,211,238,.28)}
.profile-card .pframe img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid var(--bg1)}
.profile-card h3{font-size:1.08rem}
.profile-card .role{font-size:.78rem;color:var(--neon);font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-top:4px}

/* ===================== BERANDA HERO ===================== */
.hero{position:relative;border-radius:22px;border:1px solid var(--line2);overflow:hidden;padding:clamp(26px,4.5vw,52px);margin-bottom:22px;background:
  radial-gradient(900px 420px at 90% -20%,rgba(37,99,235,.28),transparent 60%),
  radial-gradient(700px 380px at -10% 120%,rgba(34,211,238,.16),transparent 55%),
  var(--glass);box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;background:
  linear-gradient(rgba(34,211,238,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px);
  background-size:34px 34px;mask-image:radial-gradient(700px 380px at 30% 30%,#000 30%,transparent 75%);pointer-events:none}
.hero .grid-in{display:grid;grid-template-columns:1.15fr .85fr;gap:34px;align-items:center;position:relative}
.hero h1{font-size:clamp(1.7rem,3.6vw,2.7rem);font-weight:800;letter-spacing:-.02em;line-height:1.14;margin:12px 0 12px}
.hero h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{color:var(--muted);font-size:1rem;line-height:1.7;max-width:56ch}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.hero .motto{margin-top:24px;display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:.85rem;color:var(--warn);background:rgba(245,158,11,.1);border:1px dashed rgba(245,158,11,.5);padding:9px 16px;border-radius:999px}
.motto .sparkle{display:inline-block;animation:pulse 2.2s infinite}
.quick-cards .card{cursor:pointer}
.quick-cards .card .go{margin-top:12px;font-size:.8rem;font-weight:800;color:var(--neon);display:inline-flex;align-items:center;gap:6px;letter-spacing:.05em;transition:gap .2s}
.quick-cards .card:hover .go{gap:10px}

/* ===================== RESPONSIVE ===================== */
@media (max-width:1080px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero .grid-in{grid-template-columns:1fr;gap:24px}
  .hero .hero-photo{max-width:520px}
}
@media (max-width:860px){
  #btnMenu{display:inline-flex}
  .mod-select-wrap.desktop-only{display:none}
  .mid{grid-template-columns:minmax(0,1fr)}
  .sidebar{
    position:fixed;top:0;bottom:0;left:0;width:min(310px,86vw);z-index:70;
    transform:translateX(-104%);transition:transform .28s cubic-bezier(.22,.8,.36,1);
    background:var(--bg1);box-shadow:var(--shadow);
  }
  body.drawer-open .sidebar{transform:none}
  #drawerOverlay{display:block;position:fixed;inset:0;background:rgba(4,10,20,.6);z-index:65;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px)}
  body.drawer-open #drawerOverlay{opacity:1;pointer-events:auto}
  .brand .tt .title{font-size:.86rem}
  .g2,.g3{grid-template-columns:1fr}
  .g-2-1{grid-template-columns:1fr}
  .sim-grid{grid-template-columns:1fr}
  #panel{padding:20px 16px 34px}
}
@media (max-width:560px){
  .g4{grid-template-columns:1fr}
  .brand .tt .kicker{display:none}
  .brand .logo{width:36px;height:36px}
  .icon-btn{width:37px;height:37px}
  .gal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* ===================== MOTION PREFERENCES ===================== */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .wheel-rot,.spark,.scanline::before,.contact-pulse{animation:none!important}
  .spark{opacity:.6!important}
}
html[data-anim="off"] *,html[data-anim="off"] *::before,html[data-anim="off"] *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
html[data-anim="off"] .wheel-rot,html[data-anim="off"] .spark,html[data-anim="off"] .scanline::before,html[data-anim="off"] .contact-pulse{animation:none!important}
html[data-anim="off"] .spark{opacity:.6!important}
/* util */
.mt-0{margin-top:0}.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:26px}.mb-1{margin-bottom:8px}.mb-2{margin-bottom:16px}
.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.center{text-align:center}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.hide{display:none!important}

/* =====================================================================
   TGr DESIGN SYSTEM / 2026 — Industrial Precision
   Lapisan visual baru; renderer, materi dan perhitungan lama tetap utuh.
   ===================================================================== */
:root{
  --bg0:#07111d; --bg1:#0e1a2b; --bg2:#111f33; --bg3:#182c43;
  --glass:rgba(14,26,43,.94); --glass2:rgba(26,45,67,.72);
  --line:rgba(154,181,212,.14); --line2:rgba(48,204,231,.28);
  --blue:#3778e7; --cyan:#21b5d4; --neon:#38d5ed;
  --text:#f3f8fc; --muted:#9caec3; --soft:#ccdae7;
  --grad:linear-gradient(110deg,#5786f4 4%,#20c8e2 97%);
  --grad-soft:linear-gradient(135deg,rgba(48,120,223,.14),rgba(36,196,218,.075));
  --shadow:0 24px 64px rgba(0,4,15,.24);
  --shadow-sm:0 6px 24px rgba(0,5,14,.14);
  --glow:0 0 0 1px rgba(56,213,237,.32),0 8px 26px rgba(0,121,171,.13);
  --r:18px;--r-sm:11px;--sidebar-w:312px;--header-h:76px;--bottom-h:76px;
}
html[data-theme="light"]{
  --bg0:#f4f7fa;--bg1:#ffffff;--bg2:#f5f9fc;--bg3:#e6eef5;
  --glass:rgba(255,255,255,.95);--glass2:rgba(232,242,249,.9);
  --line:rgba(31,61,92,.12);--line2:rgba(16,119,167,.27);
  --blue:#2563c7;--cyan:#087e9d;--neon:#087d9b;
  --text:#122437;--muted:#53697d;--soft:#344d61;
  --grad:linear-gradient(110deg,#2563c7 5%,#087e9d 95%);
  --grad-soft:linear-gradient(130deg,rgba(37,99,199,.075),rgba(8,126,157,.035));
  --shadow:0 24px 64px rgba(37,60,93,.1);
  --shadow-sm:0 6px 24px rgba(34,60,93,.055);
  --glow:0 0 0 1px rgba(16,119,167,.26),0 8px 26px rgba(16,119,167,.1);
}
body{letter-spacing:-.008em}
h1,h2,h3,h4,.font-display,.brand .tt .title{font-family:'Space Grotesk','Poppins','Inter',sans-serif}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex="0"]:focus-visible{
  outline:2px solid var(--neon);outline-offset:3px;
}
#app{
  background:radial-gradient(800px 600px at 95% -20%,rgba(34,145,193,.075),transparent 64%),var(--bg0);
}
.app-header{padding:0 clamp(16px,2.15vw,32px);gap:17px;background:var(--glass);box-shadow:0 1px 0 rgba(255,255,255,.015)}
.brand{gap:14px}
.brand .logo{width:46px;height:46px;border-radius:12px;padding:4px;box-shadow:0 0 0 1px var(--line2)}
.brand .tt .kicker{font-size:.655rem;letter-spacing:.13em;color:var(--muted);background:none;-webkit-background-clip:initial;background-clip:initial;font-weight:700;margin-bottom:5px}
.brand .tt .title{font-size:clamp(.92rem,1.1vw,1.1rem);letter-spacing:-.025em;line-height:1.15}
.header-identity{display:flex;align-items:center;gap:9px;margin-left:auto;padding:9px 13px;border-radius:100px;background:var(--bg2);border:1px solid var(--line);color:var(--muted);font-size:.62rem;font-weight:800;letter-spacing:.13em;white-space:nowrap}
.header-identity b{color:var(--neon);font-size:.69rem;letter-spacing:.05em;border-left:1px solid var(--line);padding-left:9px}
.identity-dot{height:7px;width:7px;border-radius:50%;background:#2cd4ba;box-shadow:0 0 0 3px rgba(44,212,186,.1)}
.header-tools{margin-left:0;gap:8px}
.icon-btn{width:41px;height:41px;border-radius:11px;background:var(--bg2);border-color:var(--line);box-shadow:none}
.icon-btn:hover{transform:none;background:var(--bg3)}
.mod-select{border-radius:11px;font-size:.82rem;background:var(--bg2);max-width:230px;height:41px}
#fsMenu{top:calc(var(--header-h) - 4px);right:25px;background:var(--bg1)}
.sidebar{background:var(--bg1);border-right:1px solid var(--line)}
.sidebar-top{padding:24px 17px 13px;border-bottom:1px solid var(--line)}
.sidebar-label{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:800;font-size:.66rem;letter-spacing:.115em;margin-bottom:16px;white-space:nowrap}
.sidebar-label-dot{display:inline-block;width:8px;height:8px;border:2px solid var(--neon);border-radius:3px;transform:rotate(45deg)}
.sidebar-total{margin-left:auto;font-size:.62rem;color:var(--neon);letter-spacing:.065em}
.sidebar-search{display:flex;align-items:center;gap:10px;padding:0 12px;height:43px;border:1px solid var(--line);border-radius:11px;background:var(--bg2);transition:border .2s}
.sidebar-search:focus-within{border-color:var(--neon);box-shadow:var(--glow)}
.sidebar-search svg{width:17px;height:17px;flex:none;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round}
.sidebar-search input{color:var(--text);background:none;border:0;outline:none!important;min-width:0;flex:1;font-size:.85rem;font-weight:500;width:100%}
.sidebar-search input::-webkit-search-cancel-button{cursor:pointer}
.sidebar-search input::placeholder{color:var(--muted);opacity:.86}
.sidebar-search kbd{color:var(--muted);font-size:.69rem;font-family:inherit;border:1px solid var(--line);border-radius:5px;min-width:19px;text-align:center;padding:2px}
.search-count{font-size:.71rem;color:var(--neon);line-height:1.5;display:none;margin:9px 2px 0}
.search-count.active{display:block}
.side-scroll{padding:13px 10px 20px;scrollbar-gutter:stable}
.side-group{margin:3px 0 6px}
.side-group[hidden],.side-link[hidden]{display:none!important}
.side-group>button{padding:12px 12px 9px;color:var(--muted);font-size:.67rem;letter-spacing:.09em;gap:8px}
.side-group>button:hover{color:var(--text)}
.side-group .group-count{margin-left:auto;font-size:.64rem;min-width:20px;text-align:center;padding:3px 5px;background:var(--bg3);color:var(--muted);border-radius:5px;letter-spacing:0}
.side-group>button .chev{margin-left:0;width:13px;height:13px}
.side-link{min-height:43px;padding:9px 13px;margin:0 0 3px;border-radius:10px;font-size:.85rem;line-height:1.35;gap:11px}
.side-link .ico{width:17px;height:17px;opacity:.78}
.side-link:hover{background:var(--bg2);color:var(--text)}
.side-link.active{color:#e6fbff;background:rgba(26,148,181,.14);border-color:rgba(56,213,237,.22);box-shadow:inset 0 0 0 1px rgba(56,213,237,.045)}
html[data-theme="light"] .side-link.active{color:#086986;background:rgba(8,126,157,.085)}
.side-link.active .ico{opacity:1;color:var(--neon)}
.side-link.active::before{width:3px;top:8px;bottom:8px;box-shadow:none}
.side-link .done-dot{height:6px;width:6px;box-shadow:none;opacity:.78}
.side-foot{padding:16px 22px 19px;background:var(--bg1)}
.side-foot .lbl{font-size:.71rem;letter-spacing:.025em;color:var(--soft);text-transform:none;align-items:center}
.side-foot .lbl small{color:var(--muted);font-size:.67rem;margin-left:3px}
.progress-track{height:5px;background:var(--bg3)}
.progress-fill{box-shadow:none}
#panel{padding:31px clamp(20px,4.6vw,72px) 52px;scrollbar-gutter:stable}
#panel .view{max-width:1190px}
.page-context + .eyebrow{display:none}
.page-context{display:flex;align-items:center;gap:12px;margin-bottom:22px;font-weight:800;letter-spacing:.115em;font-size:.665rem;color:var(--muted);text-transform:uppercase}
.page-context-group{color:var(--neon)}
.page-context-divider{color:var(--line2)}
.page-context-module{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.68rem;letter-spacing:.15em;margin-bottom:11px;font-weight:800}
.eyebrow::before{width:17px}
.page-title{font-size:clamp(1.55rem,2.9vw,2.35rem)!important;line-height:1.16!important;letter-spacing:-.04em!important;margin-bottom:11px!important}
p.page-sub{max-width:72ch;font-size:.96rem;line-height:1.76;margin-bottom:27px}
.sec-title{font-size:clamp(1.1rem,1.6vw,1.35rem);letter-spacing:-.025em;margin-top:34px;gap:11px}
.sec-title .num{height:30px;width:30px;border-radius:9px;font-size:.86rem}
.sec-sub{font-size:.91rem;color:var(--muted);line-height:1.62}
p.body-p{line-height:1.78}
.card,.sim,.stepper,.sim-box,figure.fig,.table-scroll,.acc{background:var(--bg1);border-color:var(--line);box-shadow:var(--shadow-sm)}
.card{padding:clamp(18px,2.2vw,24px);border-radius:16px}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line2)}
.card.glow-top::before{opacity:.65;height:2px}
.card h3{font-size:1.02rem;letter-spacing:-.015em;line-height:1.38}
.card p{line-height:1.72}
.card .cicon{height:43px;width:43px;border-radius:11px;margin-bottom:15px}
.grid{gap:15px}
.stat-row{gap:12px;margin:18px 0 30px}
.stat{min-width:150px;padding:17px 19px;border-radius:13px;background:var(--bg1);border-color:var(--line);box-shadow:none}
.stat .v{font-family:'Space Grotesk','Inter',sans-serif;font-size:1.66rem;line-height:1.2;letter-spacing:-.06em;font-weight:700}
.stat .k{font-size:.69rem;letter-spacing:.055em;margin-top:6px}
.hero{border-radius:22px;border-color:var(--line);padding:clamp(27px,4.15vw,57px);box-shadow:var(--shadow-sm);margin-bottom:18px;
  background:radial-gradient(800px 450px at 95% -10%,rgba(26,163,207,.17),transparent 65%),linear-gradient(125deg,var(--bg1),var(--bg2))}
.hero::before{background-size:42px 42px;opacity:.43}
.hero .grid-in{grid-template-columns:1.06fr .94fr;gap:clamp(24px,4.2vw,54px)}
.hero-kicker-badge{border:1px solid var(--line2);border-radius:7px;padding:7px 10px;letter-spacing:.09em;color:var(--neon);background:rgba(34,177,211,.075)}
.hero .eyebrow::before{display:none}
.hero h1{font-family:'Space Grotesk','Poppins',sans-serif;font-size:clamp(2.08rem,3.3vw,3.65rem);letter-spacing:-.065em;line-height:1.1;margin:21px 0 20px}
.hero h1 .grad{color:var(--neon);background:var(--grad);background-clip:text;-webkit-background-clip:text}
.hero .hero-h1-suffix{font-size:.62em;color:var(--muted);letter-spacing:-.02em;white-space:nowrap}
.hero .sub{color:var(--soft);line-height:1.85;font-size:.94rem;max-width:58ch}
.hero .cta{gap:10px;margin-top:26px}
.hero .motto{background:transparent;border:0;border-left:2px solid var(--warn);color:var(--soft);padding:3px 0 3px 11px;border-radius:0;margin-top:24px;font-size:.75rem;letter-spacing:.03em}
.hero .motto .sparkle{color:var(--warn)}
.hero-photo{border-radius:15px;border-color:var(--line2);box-shadow:0 17px 46px rgba(0,5,14,.19);background:radial-gradient(circle at center,rgba(45,154,185,.24),var(--bg3))}
.hero-photo img{aspect-ratio:5/4;object-fit:cover}
.hero-photo .tag{left:15px;bottom:15px;font-size:.75rem;border-radius:7px;background:rgba(8,19,33,.84)}
.scanline::before{opacity:.5}
.section-intro{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:33px 0 17px}
.section-intro .eyebrow{margin-bottom:9px}
.section-intro .sec-title{margin:0 0 6px}
.section-intro .sec-sub{margin:0}
.section-counter{border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:8px 11px;font-size:.7rem;letter-spacing:.08em;font-weight:800;white-space:nowrap}
.quick-cards .card{min-height:202px;cursor:pointer;display:flex;flex-direction:column}
.quick-cards .card .go{margin-top:auto;padding-top:16px;letter-spacing:.025em}
.quick-cards .card:hover .go{gap:6px}
.note{border-radius:0 11px 11px 0;background:var(--grad-soft)}
.chip{border-radius:7px;font-size:.76rem}
.btn,.nav-btn{border-radius:10px;letter-spacing:-.012em}
.btn.primary,.nav-btn.primary{background:var(--grad);box-shadow:none;color:#fff}
.btn.primary:hover,.nav-btn.primary:hover:not(:disabled){box-shadow:0 9px 24px rgba(14,142,187,.2)}
.btn:hover,.nav-btn:hover:not(:disabled){transform:translateY(-1px)}
.tab{border-radius:9px}
.tab.active{box-shadow:none}
.table-scroll{border-radius:13px}
table.tbl th{background:var(--grad-soft);font-size:.7rem}
table.tbl td{line-height:1.65}
.sim-result,.formula{background:var(--grad-soft)}
figure.fig{padding:9px}
figure.fig img{object-fit:contain;background:var(--bg2)}
.zoom-hint{display:block;position:absolute;right:10px;bottom:10px;background:rgba(7,17,29,.82);border:1px solid rgba(56,213,237,.25);color:#e7fafe;border-radius:6px;padding:5px 8px;font-size:.68rem;pointer-events:none}
.ph-missing{padding:35px 15px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:10px}
.bottom-nav{padding:12px clamp(16px,2.3vw,30px);min-height:var(--bottom-h);background:var(--bg1)}
.bottom-nav .pos{min-width:140px;flex-basis:clamp(140px,19vw,250px)}
.bottom-nav .pos .lbl{text-transform:none;letter-spacing:0;font-size:.73rem;font-weight:700}
.bottom-nav .mod-select{height:42px}
.bottom-nav .mod-select-wrap{max-width:400px;margin:auto}
.nav-btn{min-height:43px}
.nav-btn .txt-short{display:none}
@media (max-width:1200px){
  .header-identity{display:none}
  .hero .grid-in{grid-template-columns:1fr 1fr;gap:22px}
  .hero h1{font-size:clamp(2rem,3.5vw,3.25rem)}
}
@media (max-width:1080px){
  .hero .grid-in{grid-template-columns:1fr;gap:25px}
  .hero .hero-photo{max-width:600px}
}
@media (max-width:860px){
  :root{--header-h:70px;--bottom-h:69px}
  .sidebar{background:var(--bg1);width:min(340px,89vw);padding-top:env(safe-area-inset-top)}
  .sidebar-top{padding-top:18px}
  .app-header{padding:0 14px;gap:10px}
  .brand .logo{width:40px;height:40px}
  .brand .tt .title{font-size:.86rem}
  .header-tools{gap:6px}
  #panel{padding:22px clamp(17px,4.5vw,32px) 42px}
  .bottom-nav .pos{flex:1 1 0;min-width:90px}
  .bottom-nav .mod-select-wrap{display:none!important}
  .nav-btn .txt-short{display:inline}
  .bottom-nav{padding-bottom:max(10px,env(safe-area-inset-bottom));gap:8px}
  .nav-btn{min-height:41px;padding:9px 12px}
  .page-context{margin-bottom:17px}
}
@media (max-width:560px){
  :root{--header-h:67px}
  .brand{gap:9px}
  .brand .logo{width:35px;height:35px;border-radius:9px}
  .brand .tt .title{font-size:.8rem;line-height:1.28;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .brand .tt .kicker{display:none}
  .header-tools{gap:5px}
  #btnFull{display:none}
  .icon-btn{width:34px;height:36px;border-radius:9px}
  .icon-btn svg{width:17px;height:17px}
  #panel{padding:20px 16px 37px}
  .hero{padding:25px 20px;border-radius:16px}
  .hero h1{font-size:clamp(1.9rem,8vw,2.65rem)}
  .hero .sub{font-size:.9rem;line-height:1.7}
  .hero .cta{flex-direction:column;align-items:stretch}
  .hero .cta .btn{justify-content:center}
  .hero-photo img{aspect-ratio:5/3}
  .stat-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{min-width:0;padding:13px}
  .stat .v{font-size:1.4rem}
  .stat .k{font-size:.62rem;line-height:1.35}
  .section-counter{display:none}
  .section-intro{margin:29px 0 15px}
  .quick-cards .card{min-height:unset}
  .bottom-nav{gap:7px;padding:9px 12px}
  .bottom-nav .pos{min-width:68px;flex:1}
  .bottom-nav .pos .lbl{font-size:.65rem;line-height:1.28;max-width:135px}
  .nav-btn{padding:9px 10px;font-size:.74rem;gap:4px}
  .nav-btn svg{width:14px;height:14px}
  .page-context{font-size:.59rem;gap:8px}
}
@media (max-width:390px){
  .quickfind-btn{display:none}
  .brand .tt .title{font-size:.75rem}
  .bottom-nav .pos{min-width:56px}
  .nav-btn{padding:9px 8px}
}


/* Fallback visual untuk repo yang belum memiliki asset gambar */

.brand .logo-shell .logo{flex:none}
.logo-fallback{display:none;align-items:center;justify-content:center;width:46px;height:46px;border-radius:11px;background:linear-gradient(125deg,#1e58ad,#119bb5);color:#fff;font-size:.77rem;font-weight:800;letter-spacing:-.02em;border:1px solid rgba(125,229,244,.3)}

.machine-fallback-label strong{font-family:'Space Grotesk',sans-serif;font-size:1rem;letter-spacing:.2em;color:#9fe7f0}

@media (max-width:860px){

          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="moduleSearch" type="search" placeholder="Cari materi..." autocomplete="off" aria-label="Cari materi pembelajaran">

  open(src, cap, list){
    this.list = list && list.length ? list : [{src, cap: cap||''}];
    this.idx = this.list.findIndex(x => x.src === src);
    if (this.idx < 0) this.idx = 0;
    $('#lbPrev').style.display = $('#lbNext').style.display = this.list.length > 1 ? '' : 'none';
    this.render();
    $('#lightbox').classList.add('open');
  },
  render(){
    const it = this.list[this.idx];
    const img = $('#lbImg');
    this.zoom = 1; this.panX = 0; this.panY = 0;
    img.classList.remove('zoomed');
    img.style.transform = '';
    img.style.left = ''; img.style.top = '';
    img.src = it.src; img.alt = it.cap || '';
    $('#lbCaption').textContent = it.cap || '';
    $('#lbCount').textContent = (this.idx+1) + ' / ' + this.list.length;
  },
  close(){ $('#lightbox').classList.remove('open'); },
  nav(d){ this.idx = (this.idx + d + this.list.length) % this.list.length; this.render(); },
  toggleZoom(){
    this.zoom = this.zoom > 1 ? 1 : 2.2;
    if (this.zoom === 1){ this.panX = 0; this.panY = 0; }
    $('#lbImg').style.transform = 'translate('+this.panX+'px,'+this.panY+'px) scale('+this.zoom+')';
    $('#lbImg').classList.toggle('zoomed', this.zoom > 1);
  }
};
function bindLightbox(){
  $('#lbClose').onclick = () => Lightbox.close();
  $('#lbPrev').onclick = () => Lightbox.nav(-1);
  $('#lbNext').onclick = () => Lightbox.nav(1);
  $('#lbZoom').onclick = () => Lightbox.toggleZoom();
  $('#lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') Lightbox.close(); });
  const img = $('#lbImg');
  img.addEventListener('dblclick', e => { e.preventDefault(); Lightbox.toggleZoom(); });
  img.addEventListener('wheel', e => {
    e.preventDefault();
    Lightbox.zoom = Math.min(4, Math.max(1, Lightbox.zoom + (e.deltaY < 0 ? .35 : -.35)));
    if (Lightbox.zoom === 1){ Lightbox.panX = 0; Lightbox.panY = 0; }
    img.style.transform = 'translate('+Lightbox.panX+'px,'+Lightbox.panY+'px) scale('+Lightbox.zoom+')';
    img.classList.toggle('zoomed', Lightbox.zoom > 1);
  }, {passive:false});
  img.addEventListener('pointerdown', e => {
    if (Lightbox.zoom <= 1) return;
    Lightbox.drag = {x: e.clientX, y: e.clientY, px: Lightbox.panX, py: Lightbox.panY};
    img.setPointerCapture(e.pointerId);
  });
  img.addEventListener('pointermove', e => {
    if (!Lightbox.drag) return;
    Lightbox.panX = Lightbox.drag.px + (e.clientX - Lightbox.drag.x);
    Lightbox.panY = Lightbox.drag.py + (e.clientY - Lightbox.drag.y);
    img.style.transform = 'translate('+Lightbox.panX+'px,'+Lightbox.panY+'px) scale('+Lightbox.zoom+')';
  });
  img.addEventListener('pointerup', () => Lightbox.drag = null);
  document.addEventListener('keydown', e => {
    if (!$('#lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') Lightbox.close();
    if (e.key === 'ArrowLeft') Lightbox.nav(-1);
    if (e.key === 'ArrowRight') Lightbox.nav(1);
  });
}

function flowHtml(nodes){

      + '<div class="fn-t">' + n.t + '</div><div class="fn-d">' + (n.d||'') + '</div>'
      + '<div class="flow-detail">' + (n.detail||'') + '</div></div>';
    if (i < nodes.length - 1){
      h += '<div class="flow-arrow"><span class="lbl">Ya — sesuai standard</span><span class="stem"></span><span class="head"></span></div>';
      h += '<div class="flow-loop">↺ Jalur <b>"Tidak"</b> — hasil latihan belum sesuai standard → <b>ulangi latihan ini</b> sebelum lanjut.</div>';
      h += '<div class="flow-arrow"><span class="stem"></span><span class="head"></span></div>';
    }
  });
  h += '</div>';
  return h;
}
function bindFlow(root){
  $$('[data-flow]', root).forEach(n => {
    n.addEventListener('click', () => {
      const d = $('.flow-detail', n);
      const open = d.classList.contains('show');
      $$('.flow-detail', root).forEach(x => x.classList.remove('show'));
      $$('.flow-node', root).forEach(x => x.classList.remove('open'));
      if (!open){ d.classList.add('show'); n.classList.add('open'); }
    });
  });
}

/* ---------- Stepper alur ---------- */
function stepperHtml(pid, steps, fotos){
  const done = LS.get('st-'+pid, false);
  let media = '';
  return '<div class="stepper" data-stepper="' + pid + '">' +
    '<div class="stepper-top"><div class="steps-lbl"><span>Tahap <b data-st-cur>1</b> / ' + steps.length + '</span><span data-st-done>' + (done ? '✓ Alur selesai ditandai' : 'Ikuti tahap demi tahap') + '</span></div>' +
    '<div class="progress-track"><div class="progress-fill" data-st-bar style="width:0%"></div></div></div>' +
    '<div class="stepper-body" data-st-body></div>' +
    '<div class="stepper-foot"><button class="btn sm" data-st-prev>← Kembali</button>' +
    '<div class="step-dots" data-st-dots>' + steps.map((_, i) => '<span class="dot"></span>').join('') + '</div>' +
    '<span class="spacer"></span><button class="btn sm primary" data-st-next>Berikutnya →</button></div></div>';
}
function bindStepper(root, pid, steps, fotos){
  const w = $('[data-stepper="' + pid + '"]', root); if (!w) return;
  let i = 0;
  const body = $('[data-st-body]', w), dots = $$('.dot', w), bar = $('[data-st-bar]', w), cur = $('[data-st-cur]', w), doneEl = $('[data-st-done]', w);
  function show(){
    const foto = fotos && fotos[i];
    body.innerHTML = '<div class="st-title"><span class="n">' + (i+1) + '</span>' + steps[i].t + '</div><div class="st-desc">' + steps[i].d + '</div>' +
      (foto ? '<div class="st-media"><img src="' + IMG + foto[0] + '" alt="' + foto[1] + '" data-zoom data-cap="' + foto[1] + '">' + (foto[1] ? '<span class="small muted" style="align-self:center;max-width:220px">' + foto[1] + '</span>' : '') + '</div>' : '');
    dots.forEach((d, k) => { d.className = 'dot' + (k < i ? ' done' : '') + (k === i ? ' cur' : ''); });
    bar.style.width = Math.round(((i+1) / steps.length) * 100) + '%';
    cur.textContent = i + 1;
    $('[data-st-prev]', w).disabled = i === 0;
    $('[data-st-next]', w).textContent = i === steps.length - 1 ? '✓ Selesai' : 'Berikutnya →';
  }
  $('[data-st-next]', w).onclick = () => {
    if (i < steps.length - 1){ i++; show(); }
    else { LS.set('st-' + pid, true); doneEl.textContent = '✓ Alur selesai ditandai — simpan progres ini'; doneEl.style.color = 'var(--ok)'; }
  };
  $('[data-st-prev]', w).onclick = () => { if (i > 0){ i--; show(); } };
  if (LS.get('st-' + pid, false)){ doneEl.style.color = 'var(--ok)'; }
  show();
}

}

/* ---------- Simulator nilai ---------- */
function fmt(n){ return (Math.round(n * 100) / 100).toString().replace('.', ','); }
function initSimNilai(root){
  let prodi = 'tpm';
  const inK = $('#inKomp', root), inP = $('#inProd', root), inNhp = $('#inNhp', root), inNes = $('#inNes', root);
  function calcNhp(){
    const k = parseFloat(inK.value), p = parseFloat(inP.value);
    if (isNaN(k) || isNaN(p)) return null;
    const nhp = prodi === 'tpm' ? (0.7 * k + 0.3 * p) : p;
    $('#nhpCalc', root).textContent = prodi === 'tpm'
      ? 'NHP = 0,7 × ' + fmt(k) + ' + 0,3 × ' + fmt(p) + ' = ' + fmt(nhp)
      : 'NHP = Nilai Produksi = ' + fmt(nhp);
    $('#nhpVal', root).textContent = fmt(nhp);
    inNhp.value = Math.round(nhp * 100) / 100;
    calcNsp();
  }
  function calcNsp(){
    const nhp = parseFloat(inNhp.value), nes = parseFloat(inNes.value);
    if (isNaN(nhp) || isNaN(nes)) return;
    const nsp = prodi === 'tpm' ? (2 * nhp + nes) / 3 : (nhp + nes) / 2;
    $('#nspCalc', root).textContent = prodi === 'tpm'
      ? 'NSP TGR = (2 × ' + fmt(nhp) + ' + ' + fmt(nes) + ') / 3 = ' + fmt(nsp)
      : 'NSP TGR = (' + fmt(nhp) + ' + ' + fmt(nes) + ') / 2 = ' + fmt(nsp);
    $('#nspVal', root).textContent = fmt(nsp);
  }
  $('#simProdiTabs', root).addEventListener('click', e => {
    const b = e.target.closest('[data-prodi]'); if (!b) return;
    prodi = b.getAttribute('data-prodi');
    $$('#simProdiTabs .tab', root).forEach(t => t.classList.toggle('active', t === b));
    $('[data-f="komp"]', root).style.display = prodi === 'tpm' ? '' : 'none';
    $('[data-hint]', root).textContent = prodi === 'tpm' ? 'Bobot 30% pada TPM–PM' : 'TMI–RTM: NHP = 100% Nilai Produksi';
    calcNhp();
  });
  [inK, inP].forEach(el => el.addEventListener('input', calcNhp));
  [inNhp, inNes].forEach(el => el.addEventListener('input', calcNsp));
  calcNhp();
}

/* ---------- Simulator kompensasi ---------- */
function initSimKom(root){
  const mesin = $('#kmMesin', root), jenis = $('#kmJenis', root), dim = $('#kmDim', root);
  const awal = $('#kmAwal', root), akhir = $('#kmAkhir', root), out = $('#kmOut', root), dimWrap = $('#kmDimWrap', root);
  function badge(t){
    if (t === 'ok') return 'chip ok';
    if (t === 'minus') return 'chip warn';
    if (t === 'amb') return 'chip warn';
    return 'chip danger';
  }
  function hitung(){
    const m = mesin.value, j = jenis.value, d = dim.value;
    const a = parseFloat(awal.value), b = parseFloat(akhir.value);
    if (isNaN(a) || isNaN(b)){ out.innerHTML = '<p class="small muted">Masukkan ukuran awal dan akhir.</p>'; return; }
    const red = Math.round((a - b) * 1000) / 1000;
    if (red < 0){ out.innerHTML = '<p style="color:var(--danger);font-weight:600">Ukuran akhir lebih BESAR dari ukuran awal — pengurangan tidak terhitung. Pada penggerindaan, ukuran berkurang; periksa kembali input.</p>'; return; }
    dimWrap.style.display = (m === 'greif' && j === 'latihan') ? '' : 'none';
    let res;
    if (m === 'gd1'){
      if (red < 0.3) res = { jam:'FREE', t:'ok', ket:'Pengurangan kurang dari 0,3 mm — bebas kompensasi. (Latihan & produksi sama.)' };
      else if (red <= 1) res = { jam:'−1 jam', t:'minus', ket:'Pengurangan ' + fmt(red) + ' mm berada pada rentang 0,3–1 mm → minus 1 jam. (Latihan & produksi sama.)' };
      else { const k = Math.ceil(red); res = { jam:'−' + (5*k) + ' jam', t:'bad', ket:'Pengurangan ' + fmt(red) + ' mm melebihi batas 1 mm → −5 jam × kelipatan. Kelipatan dihitung dibulatkan ke atas: ⌈' + fmt(red) + '⌉ = ' + k + ' → −' + (5*k) + ' jam.', warn:'Detail pembulatan kelipatan tidak dijelaskan pada PPT — konfirmasi instruktur sebelum digunakan sebagai nilai resmi.' }; }
    } else if (m === 'greif'){
      if (j === 'latihan'){
        if (red < 0.5) res = { jam:'FREE', t:'ok', ket:'Pengurangan kurang dari 0,5 mm — bebas kompensasi (pahat latihan dari instruktur R20).' };
        else if (red <= 2 && !(d === 'lebar' && red > 1.5)) res = { jam:'−1 jam', t:'minus', ket:'Pengurangan ' + fmt(red) + ' mm (dimensi ' + d + ') pada rentang 0,5–2 mm → minus 1 jam.' };
        else if (red <= 2 && d === 'lebar' && red > 1.5) res = { jam:'−1 jam / −7 jam', t:'amb', ket:'Pengurangan ' + fmt(red) + ' mm: rentang 0,5–2 mm → −1 jam, NAMUN batas pengurangan lebar 1,5 mm dengan ketentuan lebih dari batas → −7 jam. Kedua ketentuan bertumpuk pada PPT.', warn:'Kasus tumpang tindih 1,5–2 mm untuk lebar — konfirmasi instruktur.' };
        else res = { jam:'−7 jam', t:'bad', ket:'Pengurangan ' + fmt(red) + ' mm melebihi batas ' + (d === 'lebar' ? 'lebar 1,5 mm' : 'panjang 2 mm') + ' → minus 7 jam.' };
      } else {
        if (red < 0.3) res = { jam:'FREE', t:'ok', ket:'Produksi (pahat kamar alat R16): kurang dari 0,3 mm — bebas kompensasi.' };
        else if (red <= 1) res = { jam:'−1 jam', t:'minus', ket:'Produksi: pengurangan 0,3–1 mm → minus 1 jam.' };
        else { const k = Math.ceil(red); res = { jam:'−' + (5*k) + ' jam', t:'bad', ket:'Produksi: melebihi batas 1 mm → −5 jam × kelipatan (⌈' + fmt(red) + '⌉ = ' + k + ') → −' + (5*k) + ' jam.', warn:'Detail pembulatan kelipatan tidak dijelaskan pada PPT — konfirmasi instruktur.' }; }
      }
    } else {
      if (j === 'latihan') res = { jam:'FREE', t:'ok', ket:'Twistdrill latihan dari instruktur — FREE kompensasi (boleh dihabiskan).' };
      else if (red <= 5) res = { jam:'FREE', t:'ok', ket:'Pengurangan 5 mm pertama — bebas kompensasi (twistdrill produksi dari kamar alat).' };
      else { const ex = red - 5, k = Math.ceil(ex / 3); res = { jam:'−' + k + ' jam', t:'bad', ket:'Pengurangan ' + fmt(red) + ' mm melebihi 5 mm → kelebihan ' + fmt(ex) + ' mm; per 3 mm-nya −1 jam (dibulatkan ke atas: ⌈' + fmt(ex) + '/3⌉ = ' + k + ') → −' + k + ' jam.', warn:'Pembulatan "per 3 mm-nya" tidak dijelaskan pada PPT — konfirmasi instruktur.' }; }
    }
    out.innerHTML =
      '<div class="row"><span>Pengurangan</span><b>' + fmt(red) + ' mm</b></div>' +
      '<div class="row"><span>Keterangan rentang</span><b style="text-align:right;max-width:70%">' + res.ket + '</b></div>' +
      '<div style="margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="small muted">Jam minus:</span><span class="' + badge(res.t) + '" style="font-size:1.02rem">' + res.jam + '</span></div>' +
      (res.warn ? '<p class="small mt-1" style="color:var(--warn);line-height:1.55">⚠ ' + res.warn + '</p>' : '');
  }
  [mesin, jenis, dim, awal, akhir].forEach(el => el.addEventListener('input', hitung));
  [mesin, jenis, dim].forEach(el => el.addEventListener('change', hitung));
  hitung();
}

  function items(){
    return GALERI.filter(g => cur === 'Semua' || g.g === cur).flatMap(g => g.items.map(i => ({src: IMG + i[0], cap: i[1] + ' — ' + g.g})));
  }
  function render(){
    filter.innerHTML = ['Semua'].concat(groups).map(g => '<button class="tab'+(g===cur?' active':'')+'" data-g="'+g+'">'+g+'</button>').join('');
    grid.innerHTML = items().map(it =>
      '<div class="gal-item" data-src="'+it.src+'" data-cap="'+it.cap+'"><img src="'+it.src+'" alt="'+it.cap+'" loading="lazy"><span class="cap">'+it.cap+'</span></div>').join('');

  });

    const it = e.target.closest('.gal-item'); if (!it) return;
    Lightbox.open(it.getAttribute('data-src'), it.getAttribute('data-cap'), items());
  });
  render();
}

/* ---------- Kuis ---------- */
function initQuiz(root){
  const app = $('#quizApp', root);
  const CATS = Array.from(new Set(QUIZ.map(q => q.c)));
  let state = null;
  function start(){
    state = { i: 0, score: 0, answered: false, order: shuffle(QUIZ.map((_, i) => i)), log: QUIZ.map(() => null) };
    renderQ();
  }
  function renderQ(){
    const qi = state.order[state.i];
    const q = QUIZ[qi];
    const opts = q.o.map((o, oi) => ({o, oi}));
    app.innerHTML =
      '<div class="quiz-head"><span class="q-cat">'+q.c+'</span><span class="small muted">Soal '+(state.i+1)+' / '+state.order.length+' · Skor: '+state.score+'</span></div>' +
      '<div class="progress-track mb-2"><div class="progress-fill" style="width:'+Math.round((state.i/state.order.length)*100)+'%"></div></div>' +
      '<div class="card"><h3 style="font-size:1.06rem;line-height:1.5">'+q.q+'</h3><div class="mt-2">' +
      opts.map((x, k) => '<button class="q-opt" data-oi="'+x.oi+'"><span class="abc">'+'ABCD'[k]+'</span><span>'+x.o+'</span></button>').join('') +
      '</div><div id="qAfter"></div>' +
      '<div class="flex mt-2"><button class="btn sm" id="qStop">Akhiri & lihat hasil</button></div></div>';
    $$('.q-opt', app).forEach(b => b.onclick = () => answer(+b.getAttribute('data-oi')));
    $('#qStop', app).onclick = finish;
  }
  function answer(oi){
    if (state.answered) return;
    state.answered = true;
    const qi = state.order[state.i];
    const q = QUIZ[qi];
    const ok = oi === q.a;
    if (ok) state.score++;
    state.log[qi] = ok;
    $$('.q-opt', app).forEach(b => {
      const v = +b.getAttribute('data-oi');
      b.disabled = true;
      if (v === q.a) b.classList.add('correct');
      else if (v === oi) b.classList.add('wrong');
    });
    $('#qAfter', app).innerHTML =
      '<div class="q-explain'+(ok?'':' w')+'"><b>'+(ok?'✓ Benar!':'✗ Belum tepat — jawaban: '+q.o[q.a]+'</b>')+'</b><br>'+q.w+'</div>' +
      '<div class="flex"><button class="btn primary sm" id="qNext">'+(state.i === state.order.length-1 ? 'Lihat Hasil' : 'Soal Berikutnya →')+'</button></div>';
    $('#qNext', app).onclick = () => {
      if (state.i < state.order.length - 1){ state.i++; state.answered = false; renderQ(); }
      else finish();
    };
  }
  function finish(){
    const done = state.log.filter(x => x !== null);
    const pct = Math.round(done.filter(Boolean).length / done.length * 100);
    const perCat = CATS.map(c => {
      const idx = QUIZ.map((q, i) => ({q, i})).filter(x => x.q.c === c && state.log[x.i] !== null);
      const benar = idx.filter(x => state.log[x.i]).length;
      return { c, benar, total: idx.length };
    }).filter(x => x.total > 0);
    app.innerHTML =
      '<div class="card score-hero"><div class="eyebrow" style="justify-content:center">Ringkasan Hasil</div>' +
      '<div class="big">'+pct+'</div><p class="muted">Skor '+state.score+' dari '+done.length+' soal dijawab ('+done.length+' dari '+QUIZ.length+' soal tersedia)</p>' +
      '<p style="margin-top:6px;font-weight:700;color:'+(pct>=80?'var(--ok)':pct>=60?'var(--warn)':'var(--danger)')+'">'+(pct>=80?'Hebat! Materi dikuasai dengan baik.':pct>=60?'Cukup baik — tinjau kembali materi yang salah.':'Ayo pelajari kembali materinya, lalu ulangi kuis.')+'</p>' +
      '<div class="cat-bars">'+perCat.map(x =>
        '<div class="cb"><span>'+x.c+'</span><span class="track"><span class="fill" style="display:block;width:'+Math.round(x.benar/x.total*100)+'%"></span></span><b>'+x.benar+'/'+x.total+'</b></div>').join('')+'</div>' +
      '<div class="flex mt-3" style="justify-content:center"><button class="btn primary" id="qRetry">⟲ Ulangi Kuis</button><button class="btn" data-goto="pengenalan">Kembali ke Materi</button></div>' +
      '<p class="small muted mt-2">Kuis adalah latihan pembelajaran dan bukan sistem nilai akademik resmi.</p></div>';
    $('#qRetry', app).onclick = start;
  }
  app.innerHTML =
    '<div class="card score-hero"><div class="cicon" style="margin:0 auto 14px"><svg viewBox="0 0 24 24">'+ICONS.quiz+'</svg></div>' +
    '<h3 style="font-size:1.2rem">'+QUIZ.length+' soal pilihan ganda</h3>' +
    '<p class="muted" style="max-width:52ch;margin:10px auto 0">Mencakup: aturan section, K3, pengenalan mesin, spesifikasi Great D1, fungsi komponen, batu gerinda, perlengkapan, alur proses, toleransi, penilaian, dan kompensasi. Jawaban dibahas langsung setelah menjawab.</p>' +
    '<div class="chips" style="justify-content:center">'+CATS.map(c => '<span class="chip">'+c+'</span>').join('')+'</div>' +
    '<button class="btn primary mt-2" id="qStart">Mulai Kuis →</button></div>';
  $('#qStart', app).onclick = start;
}

  { id:'toleransi',      g:'Penilaian',            t:'Toleransi & Form Penilaian',       icon:'chart',     render:rToleransi },

  { id:'kom-vitax',      g:'Kompensasi',           t:'Kompensasi Vitax',                 icon:'clock',     render:rKomVitax },
  { id:'sim-kom',        g:'Kompensasi',           t:'Simulator Kompensasi',             icon:'calc',      render:rSimKom },
  { id:'perhatian',      g:'Panduan Praktik',      t:'Perlu Diperhatikan',               icon:'alert',     render:rPerhatian },
